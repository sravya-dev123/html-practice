<body>
<!--computer code
HTML contains several elements for defining user input and computer code.
-->
<h1>small program computer code</h1>
<!--usually it can print like a computer code-->
<code>
    x=10;
    y=2;
    x+y=z;
</code>

<!--HTML <kbd> For Keyboard Input
The HTML <kbd> element is used to define keyboard input. The content inside is displayed in the browser's default monospace font.-->

<p>it can save as pressing by 
<kbd>ctrl + s</kbd></p>

<!--HTML <samp> For Program Output
The HTML <samp> element is used to define sample output from a computer program. The content inside is displayed in the browser's default monospace font.-->

    <p>message print:</p>
    <p><samp>file not found</samp></p>
    <p><kbd>file not found</kbd></p>

    <!--there is no difference betweeen those -->

    <!--html <code> for computer code-->
<code>
    x=3;
    y=7;
    x+y=z;
</code>

<!--preserve line-breaks
it can print the line by break-->
<pre>
<code>
x = 5;
y = 6;
z = x + y;
</code>
</pre>

<!--The HTML <var> element  is used to define a variable in programming or in a mathematical expression. The content inside is typically displayed in italic.-->
<p>The area of a triangle is: 1/2 x <var>b</var> x <var>h</var>, where <var>b</var> is the base, and <var>h</var> is the vertical height.</p>

<!--The <kbd> element defines keyboard input
The <samp> element defines sample output from a computer program
The <code> element defines a piece of computer code
The <var> element defines a variable in programming or in a mathematical expression
The <pre> element defines preformatted text-->
