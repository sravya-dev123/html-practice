<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .button{
   
  background-color: #04AA6D;
  color: white;
  font-size: 15px;
  padding: 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  background-color: #059862;
} 
</style>
<body>
    <!--BUTTONS-->
    <!--The HTML button element defines a clickable button.
By itself, the button does nothing until you add an action to it.-->

<!--normal button-->
<button>click me</button>


<!--styling html button-->
<button class="button">click me</button>

<!--if dont want Disabled Buttons
Use the disabled attribute to make a button unclickable:-->
<button disabled> disabled button</button>

<!--types of butons-->
<button type="button">normal button</button>
<button type="submit">Submit</button>
<button type="reset">Reset</button>


<form>
    first name:<input type="text" name="fname"><br>
    second name:<input type="text" name="fname"><br>
    <button type="submit">submit</button><br>
    <button type="reset">reset</button>
</form>
</body>
</html>
